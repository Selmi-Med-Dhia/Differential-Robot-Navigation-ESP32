[platformio]
default_envs = esp32dev_microros

[env]
platform = espressif32@^6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
build_unflags =
    -std=gnu++11

; Select this environment when the robot should communicate through micro-ROS.
[env:esp32dev_microros]
board_microros_distro = humble
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
build_flags =
    ${env.build_flags}
    -DCOMMUNICATION_MICROROS=1

; Select this environment when the robot should use the simple Serial2 UART protocol.
; UART mode does not link micro-ROS at all.
[env:esp32dev_uart]
build_flags =
    ${env.build_flags}
    -DCOMMUNICATION_UART=1
