name: Firmware build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create PlatformIO environment expected by micro-ROS
        run: |
          python -m venv "$HOME/.platformio/penv"
          "$HOME/.platformio/penv/bin/pip" install platformio

      - name: Build firmware
        run: |
          "$HOME/.platformio/penv/bin/pio" run -e esp32dev
